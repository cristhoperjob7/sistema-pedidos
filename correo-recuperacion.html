<!-- Plantilla para: Supabase > Authentication > Emails > Reset Password -->
<!-- Asunto sugerido: Restablece tu contraseña -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #241529;">
  <div style="background: #4B1E4D; color: #ffffff; padding: 20px 24px; border-radius: 12px 12px 0 0;">
    <strong style="font-size: 18px;">Sistema de Pedidos</strong>
  </div>
  <div style="border: 1px solid #e2dce8; border-top: none; padding: 24px; border-radius: 0 0 12px 12px;">
    <h2 style="margin: 0 0 12px; font-size: 20px;">Restablece tu contraseña</h2>
    <p style="margin: 0 0 20px; line-height: 1.5;">
      Recibimos una solicitud para cambiar la contraseña de tu cuenta. Toca el botón para crear una nueva.
    </p>
    <p style="margin: 0 0 24px;">
      <a href="{{ .ConfirmationURL }}"
         style="display: inline-block; background: #4B1E4D; color: #ffffff; padding: 12px 22px; border-radius: 8px; text-decoration: none; font-weight: bold;">
        Crear nueva contraseña
      </a>
    </p>
    <p style="margin: 0; font-size: 13px; color: #6f6477; line-height: 1.5;">
      Si no pediste este cambio, ignora este correo: tu contraseña actual sigue funcionando.
      El enlace vence en una hora.
    </p>
  </div>
</div>
